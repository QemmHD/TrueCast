name: Deploy TrueCast to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public app
        run: |
          mkdir -p _site
          cp index.html style.css atmosphere.css observatory.css app.js api.js refresh.js forecast-time.js sources.js weather-maps.js environment.js hazard-data.js conditions.js celestial.js atlas.js radar.js radar-timeline.js forecast-strip.js ui.js install.js sw.js manifest.webmanifest .nojekyll _site/
          cp -r icons _site/icons
          cp -r vendor _site/vendor
      - name: Version the complete app shell
        run: python3 scripts/stamp-shell.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
